services:
  - type: web
    name: ucl-archive-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPERADMIN_EMAIL
        value: nicolasnieto191213@gmail.com
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_2_NAME
        value: Co-Desarrollador
      - key: SUPERADMIN_2_EMAIL
        sync: false
      - key: SUPERADMIN_2_PASSWORD
        sync: false
      - key: SMTP_USER
        value: nicolasnieto191213@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_2_USER
        sync: false
      - key: SMTP_2_PASS
        sync: false
